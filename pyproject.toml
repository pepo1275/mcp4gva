[project]
name = "mcp4gva"
version = "0.1.0"
description = "MCP server for GVA GIS ArcGIS API - Access Generalitat Valenciana land activities data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "mcp4gva"}
]
dependencies = [
    "mcp>=0.9.0",
    "requests>=2.31.0",
]

[project.scripts]
mcp4gva = "mcp4gva.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
