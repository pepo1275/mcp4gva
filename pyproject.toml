[project]
name = "mcp4gva"
version = "0.1.0"
description = "MCP server for GVA GIS ArcGIS API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "requests>=2.31.0",
]

[project.scripts]
mcp4gva = "mcp4gva.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
